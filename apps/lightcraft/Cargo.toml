[package]
name = "lightcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "lightcraft"

[lints]
workspace = true

[features]
# Run face recognition models (adds the tract runtime, about 20 MB). On by default; `--no-default-features` is the lite build.
default = ["recognition", "denoise"]
recognition = ["lightcraft-engine/recognition"]
# Run AI denoise models (the same tract runtime as `recognition`: no extra size). Off in the lite build.
denoise = ["lightcraft-engine/denoise"]

[dependencies]
lightcraft-engine = { workspace = true }
lightcraft-sysmem = { workspace = true }
lightcraft-ui-egui = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for lightcraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
